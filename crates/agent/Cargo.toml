[package]
name = "central-sos-agent"
version = "0.1.0"
edition = "2021"
build = "build.rs"
[dependencies]
central-sos-core = { path = "../core" }
central-sos-link = { path = "../link" }
boa_engine = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
