[package]
name = "central-sos"
version = "0.2.0"
description = "CENTRAL SOS Desktop"
authors = ["CENTRAL SOS"]
edition = "2021"
[lib]
name = "central_sos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
central-sos-core = { path = "../crates/core" }
central-sos-link = { path = "../crates/link" }
tauri-plugin-updater = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
minisign-verify = "0.2.5"

[target.'cfg(windows)'.dependencies]
wmi = "0.18.4"
